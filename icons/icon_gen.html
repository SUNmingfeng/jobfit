<!-- 图标生成模板 - 在浏览器中打开，截图保存为PNG -->
<!DOCTYPE html>
<html>
<head>
<style>
.icon16, .icon48, .icon128 {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #2563EB 0%, #1d4ed8 100%);
  border-radius: 20%;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: bold;
  margin: 10px;
}
.icon16 {
  width: 16px;
  height: 16px;
  font-size: 10px;
  border-radius: 3px;
}
.icon48 {
  width: 48px;
  height: 48px;
  font-size: 28px;
  border-radius: 10px;
}
.icon128 {
  width: 128px;
  height: 128px;
  font-size: 72px;
  border-radius: 22px;
}
.container {
  padding: 20px;
  background: #f0f0f0;
}
</style>
</head>
<body>
<div class="container">
  <div class="icon128">🔍</div>
  <div class="icon48">🔍</div>
  <div class="icon16">J</div>
</div>
</body>
</html>
